name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.3.0)
        required: true
        type: string
      windows:
        description: Windows portable EXE
        type: boolean
        default: true
      linux_binary:
        description: Linux native binary
        type: boolean
        default: true
      linux_appimage:
        description: Linux AppImage
        type: boolean
        default: false
      linux_deb:
        description: Linux DEB
        type: boolean
        default: false
      macos_dmg:
        description: macOS DMG (unsigned)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and selections
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS: ${{ inputs.windows }}
          LINUX_BINARY: ${{ inputs.linux_binary }}
          LINUX_APPIMAGE: ${{ inputs.linux_appimage }}
          LINUX_DEB: ${{ inputs.linux_deb }}
          MACOS_DMG: ${{ inputs.macos_dmg }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read = path => readFileSync(path, 'utf8');
          const json = path => JSON.parse(read(path));
          const version = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Enter a version such as 1.3.0');
          if (!['WINDOWS', 'LINUX_BINARY', 'LINUX_APPIMAGE', 'LINUX_DEB', 'MACOS_DMG'].some(key => process.env[key] === 'true')) throw new Error('Select at least one output');
          const cargoVersion = path => {
            const block = read(path).match(path.endsWith('.lock') ? /\[\[package\]\]\s*name = "plex_suite"\s*version = "([^"]+)"/ : /\[package\][\s\S]*?^version = "([^"]+)"/m);
            if (!block) throw new Error(`Cannot find package version in ${path}`);
            return block[1];
          };
          const versions = {
            'package.json': json('package.json').version,
            'package-lock.json': json('package-lock.json').version,
            'package-lock.json root': json('package-lock.json').packages[''].version,
            'src-tauri/Cargo.toml': cargoVersion('src-tauri/Cargo.toml'),
            'src-tauri/Cargo.lock': cargoVersion('src-tauri/Cargo.lock'),
            'src-tauri/tauri.conf.json': json('src-tauri/tauri.conf.json').version
          };
          for (const [file, actual] of Object.entries(versions)) if (actual !== version) throw new Error(`${file}: ${actual} does not match ${version}`);
          NODE

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      windows: ${{ inputs.windows }}
      linux_binary: ${{ inputs.linux_binary }}
      linux_appimage: ${{ inputs.linux_appimage }}
      linux_deb: ${{ inputs.linux_deb }}
      macos_dmg: ${{ inputs.macos_dmg }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          mapfile -d '' files < <(find dist -type f -print0)
          test "${#files[@]}" -gt 0
          gh api "repos/$GH_REPO/releases" -f tag_name="v$VERSION" -f target_commitish="$TARGET" -f name="PlexSuite v$VERSION" -f body="PlexSuite v$VERSION" -F draft=true > /dev/null
          gh release upload "v$VERSION" "${files[@]}"
